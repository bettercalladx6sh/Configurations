# ============================================================
# Docker Deployment Guide
# ============================================================
#
# BEFORE USING THIS WORKFLOW, REPLACE THE FOLLOWING:
#
# 1. [DOCKER-IMAGE]
#    Your Docker image name.
#    Example:
#      username/my-app:latest
#
# 2. [CONTAINER-NAME]
#    Name for the Docker container.
#    Example:
#      my-app
#
# 3. [HOST-PORT]
#    Port exposed on your EC2 instance.
#    Example:
#      3000
#
# 4. [CONTAINER-PORT]
#    Port your application listens on inside the container.
#    Example:
#      3000
#
# 5. GitHub Repository Secrets
#    Add these under:
#    GitHub → Settings → Secrets and variables → Actions
#
#    EC2_HOST
#      → EC2 public IP address or DNS
#
#    EC2_USERNAME
#      → EC2 SSH username
#      Example: ubuntu
#
#    EC2_SSH_KEY
#      → Your EC2 private SSH key (.pem content)
#
# ============================================================
# Example:
#
# Docker image:     username/my-app:latest
# Container name:   my-app
# Host port:        3000
# Container port:   3000
#
# Port mapping:
#   EC2:3000 → Container:3000
#
# ============================================================

deploy:
  runs-on: ubuntu-latest
  needs: build

  steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.2.2
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}

        script: |
          docker pull [DOCKER-IMAGE]

          docker stop [CONTAINER-NAME] || true
          docker rm [CONTAINER-NAME] || true

          docker run -d \
            --name [CONTAINER-NAME] \
            -p [HOST-PORT]:[CONTAINER-PORT] \
            --restart unless-stopped \
            [DOCKER-IMAGE]
