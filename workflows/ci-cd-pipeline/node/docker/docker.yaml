# ============================================================
# Docker Hub Build & Push Guide
# ============================================================
#
# BEFORE USING THIS WORKFLOW, REPLACE THE FOLLOWING:
#
# 1. GitHub Repository Secrets
#    Add these under:
#    GitHub → Settings → Secrets and variables → Actions
#
#    DOCKERHUB_USERNAME
#      → Your Docker Hub username
#
#    DOCKERHUB_TOKEN
#      → Docker Hub Access Token
#
# 2. [DOCKER-HUB-REPO]
#    Replace this with your Docker Hub repository.
#
#    Format:
#      DOCKERHUB_USERNAME/REPOSITORY_NAME:latest
#
#    Example:
#      adx6sh/my-app:latest
#
# 3. Dockerfile
#    Make sure a Dockerfile exists in the root of your
#    GitHub repository.
#
# ============================================================
# This workflow:
#
#   1. Logs in to Docker Hub
#   2. Sets up QEMU for multi-platform builds
#   3. Sets up Docker Buildx
#   4. Builds the Docker image
#   5. Pushes the image to Docker Hub
#
# ============================================================

# Docker Workflow

- name: Login to Docker Hub
  uses: docker/login-action@v4
  with:
    username: ${{ secrets.DOCKERHUB_USERNAME }}
    password: ${{ secrets.DOCKERHUB_TOKEN }}

- name: Set up QEMU
  uses: docker/setup-qemu-action@v4

- name: Set up Docker Buildx
  uses: docker/setup-buildx-action@v4

- name: Build and push
  uses: docker/build-push-action@v7
  with:
    push: true
    tags: [DOCKER-HUB-REPO]
